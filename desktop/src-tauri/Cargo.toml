[package]
# The binary name is what macOS shows for dev runs (menu bar, Dock, AX), so
# it matches the productName rather than the scaffold's "desktop".
name = "nurb"
version = "0.1.0"
description = "The nurb desktop app"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nurb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
agent-client-protocol = "2.0.0"
tokio = { version = "1", features = ["rt", "process", "io-util", "sync", "macros", "time"] }
async-process = "2"
futures-lite = "2"
sha2 = "0.10"
# Part deletion goes through the Trash, never rm: it is the one place the app
# destroys user work, so it has to be recoverable.
trash = "5"
tauri-plugin-clipboard-manager = "2"

# The Gemini API key's store on Windows: the Credential Manager, where macOS
# uses the Keychain through the security CLI (agents.rs). windows-sys carries
# the Job Object calls that keep child processes from outliving the app
# (proc.rs).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

